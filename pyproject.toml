[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "rome"
version = "0.1.0"
description = "A Vulkan-backed 3D viewport you can drive from Python"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Keaden Knight" }]
keywords = ["vulkan", "3d", "graphics", "viewport", "rendering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
Homepage = "https://github.com/Keaden/ROME"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/wheel"
cmake.version = ">=3.28"

# Only the extension module is wanted in a wheel; the demos and the C++ test
# binary are development-tree concerns.
cmake.define.ROME_BUILD_EXAMPLES = "OFF"
cmake.define.ROME_BUILD_TESTS = "OFF"
cmake.define.ROME_BUILD_PYTHON = "ON"

# python/CMakeLists.txt installs the package contents into rome/ directly.
wheel.packages = []

sdist.exclude = ["build", ".vscode", "*.pyd", "*.lib", "*.exe"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
